name: One-shot finalize Cohort 001 cost repair

on:
  push:
    branches:
      - agent/strategy-cohort-001-seed-20260921
    paths:
      - .github/workflows/cohort_001_finalize_repair.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-cohort-001-seed-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse validated deterministic repair block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/cohort_001_cost_repair_once.yml').read_text(encoding='utf-8')
          start = '      - name: Apply outcome-blind cost-semantics repair\n        shell: bash\n        run: |\n'
          end = '\n      - name: Install focused test dependency\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('repair workflow extraction anchors drifted')
          block = text.split(start, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected indentation in repair block')
          Path('/tmp/apply_repair.sh').write_text(
              '\n'.join(line[10:] if line else '' for line in lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/apply_repair.sh
      - name: Validate and regenerate canonical receipt
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_strategy_factory_cohort_001_admission.py \
            tests/test_strategy_predeclaration.py \
            tests/test_scientific_design_identity.py
          python -m orchestration.strategy_factory_cohort_001_admission > orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json
          python -m pytest -q tests/test_strategy_factory_cohort_001_receipt_lock.py
      - name: Create clean validated commit object without helper workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          parent = os.environ['PARENT_SHA']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent_obj = request('GET', f'{api}/git/commits/{parent}')
          base_tree = parent_obj['tree']['sha']
          paths = [
              'orchestration/strategy_predeclaration.py',
              'orchestration/strategy_behavior_schema.py',
              'orchestration/strategy_behavior_value_contract.py',
              'orchestration/strategy_factory_cohort_001_admission.py',
              'orchestration/cohorts/strategy_factory_cohort_001_seed.json',
              'orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json',
              'tests/test_strategy_factory_cohort_001_admission.py',
              '.github/workflows/strategy_factory_cohort_001_admission.yml',
          ]
          entries = []
          for path in paths:
              raw = Path(path).read_bytes()
              blob = request('POST', f'{api}/git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          for path in (
              '.github/workflows/cohort_001_cost_repair_once.yml',
              '.github/workflows/cohort_001_export_repair.yml',
              '.github/workflows/cohort_001_finalize_repair.yml',
          ):
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})

          tree = request('POST', f'{api}/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = request('POST', f'{api}/git/commits', {
              'message': 'Fix Cohort-001 perpetual funding cost semantics',
              'tree': tree['sha'],
              'parents': [parent],
          })
          result = {
              'commit_sha': commit['sha'],
              'parent_sha': parent,
              'tree_sha': tree['sha'],
              'files': paths,
              'helpers_removed': True,
          }
          Path('/tmp/cohort_001_final_commit.json').write_text(json.dumps(result, sort_keys=True), encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cohort-001-final-commit-object
          path: /tmp/cohort_001_final_commit.json
          if-no-files-found: error
          retention-days: 1
