name: One-shot Cohort 001 funding-cost repair

on:
  push:
    branches:
      - agent/strategy-cohort-001-seed-20260921
    paths:
      - .github/workflows/cohort_001_cost_repair_once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-cohort-001-seed-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile current canonical main once
        shell: bash
        run: |
          git config user.name "strategy-factory-bot"
          git config user.email "strategy-factory-bot@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main
      - name: Apply outcome-blind cost-semantics repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one target, found {count}")
              return text.replace(old, new, 1)

          # Generic predeclaration: exact mechanism schemas still decide which
          # funding representation is legal. The adverse per-trade representation
          # must be strictly positive; zero cannot masquerade as after-cost.
          path = "orchestration/strategy_predeclaration.py"
          text = read(path)
          text = replace_once(
              text,
              '    "funding_bps_per_day",\n',
              '',
              "remove globally-required daily funding field",
          )
          text = replace_once(
              text,
              '\nIDENTITY_FIELDS = {\n',
              '\nALTERNATIVE_FUNDING_COST_FIELDS = (\n'
              '    "funding_bps_per_day",\n'
              '    "adverse_funding_allowance_bps_per_trade",\n'
              ')\n\nIDENTITY_FIELDS = {\n',
              "insert alternative funding-cost fields",
          )
          old = (
              '    for field in ("fees_bps", "spread_bps", "slippage_bps", "funding_bps_per_day"):\n'
              '        _require_nonnegative_number(costs[field], f"cost_model.{field}")\n'
          )
          new = (
              '    for field in ("fees_bps", "spread_bps", "slippage_bps"):\n'
              '        _require_nonnegative_number(costs[field], f"cost_model.{field}")\n'
              '    funding_cost_fields = [\n'
              '        field for field in ALTERNATIVE_FUNDING_COST_FIELDS if field in costs\n'
              '    ]\n'
              '    if len(funding_cost_fields) != 1:\n'
              '        raise RuntimeError(\n'
              '            "cost_model must contain exactly one reviewed funding-cost field: "\n'
              '            + ", ".join(ALTERNATIVE_FUNDING_COST_FIELDS)\n'
              '        )\n'
              '    funding_field = funding_cost_fields[0]\n'
              '    funding_value = _require_nonnegative_number(\n'
              '        costs[funding_field], f"cost_model.{funding_field}"\n'
              '    )\n'
              '    if funding_field == "adverse_funding_allowance_bps_per_trade" and funding_value <= 0.0:\n'
              '        raise RuntimeError(\n'
              '            "cost_model.adverse_funding_allowance_bps_per_trade must be strictly positive"\n'
              '        )\n'
          )
          text = replace_once(text, old, new, "replace cost validation")
          write(path, text)

          # Exact behavior schema: split the seven directional OHLCV mechanisms
          # from C101-H delta carry, which remains on PIT funding-data semantics.
          path = "orchestration/strategy_behavior_schema.py"
          text = read(path)
          text = replace_once(
              text,
              "BEHAVIOR_SCHEMA_REGISTRY_VERSION = 1",
              "BEHAVIOR_SCHEMA_REGISTRY_VERSION = 2",
              "schema registry version",
          )
          insert = (
              'COMMON_COHORT_OHLCV_COST = _fields(\n'
              '    "fees_bps",\n'
              '    "spread_bps",\n'
              '    "slippage_bps",\n'
              '    "adverse_funding_allowance_bps_per_trade",\n'
              '    "stress_multipliers",\n'
              ')\n\n'
          )
          text = replace_once(
              text,
              "COMMON_COHORT_OHLCV_DATA = _fields(\n",
              insert + "COMMON_COHORT_OHLCV_DATA = _fields(\n",
              "insert OHLCV cost schema",
          )
          marker = '    "C101_DELTA_CARRY_V1": _schema('
          if text.count(marker) != 1:
              raise SystemExit("schema: delta-carry marker drifted")
          before, after = text.split(marker, 1)
          count = before.count("cost_model=COMMON_PREDECLARATION_COST,")
          if count != 7:
              raise SystemExit(f"schema: expected 7 non-carry Cohort cost uses, found {count}")
          before = before.replace(
              "cost_model=COMMON_PREDECLARATION_COST,",
              "cost_model=COMMON_COHORT_OHLCV_COST,",
          )
          write(path, before + marker + after)

          # Closed value contract follows the same exact split and version bind.
          path = "orchestration/strategy_behavior_value_contract.py"
          text = read(path)
          text = replace_once(
              text,
              "BEHAVIOR_VALUE_CONTRACT_VERSION = 1",
              "BEHAVIOR_VALUE_CONTRACT_VERSION = 2",
              "value-contract version",
          )
          insert = (
              'COMMON_COHORT_OHLCV_COST = _section(\n'
              '    fees_bps=number(),\n'
              '    spread_bps=number(),\n'
              '    slippage_bps=number(),\n'
              '    adverse_funding_allowance_bps_per_trade=number(),\n'
              '    stress_multipliers=number_list(),\n'
              ')\n\n'
          )
          text = replace_once(
              text,
              "COMMON_COHORT_DATA = _section(\n",
              insert + "COMMON_COHORT_DATA = _section(\n",
              "insert OHLCV cost value contract",
          )
          marker = '    "C101_DELTA_CARRY_V1": {'
          if text.count(marker) != 1:
              raise SystemExit("value contract: delta-carry marker drifted")
          before, after = text.split(marker, 1)
          count = before.count('"cost_model": COMMON_COST,')
          if count != 7:
              raise SystemExit(f"value contract: expected 7 non-carry Cohort cost uses, found {count}")
          before = before.replace(
              '"cost_model": COMMON_COST,',
              '"cost_model": COMMON_COHORT_OHLCV_COST,',
          )
          write(path, before + marker + after)

          # Freeze the already-predeclared 4 bps/trade adverse allowance only in
          # the shared directional OHLCV contract. Delta carry keeps its explicit
          # funding_bps_per_day placeholder and remains DATA_BLOCKED.
          path = "orchestration/cohorts/strategy_factory_cohort_001_seed.json"
          text = read(path)
          old = '      "funding_bps_per_day": 0.0,\n'
          if text.count(old) != 2:
              raise SystemExit(f"seed: expected common + delta daily funding fields, found {text.count(old)}")
          text = text.replace(
              old,
              '      "adverse_funding_allowance_bps_per_trade": 4.0,\n',
              1,
          )
          if text.count('"adverse_funding_allowance_bps_per_trade": 4.0') != 1:
              raise SystemExit("seed: adverse allowance must be frozen exactly once")
          write(path, text)

          # Admission receipt exposes the exact Stage-1 drag mechanically from the
          # frozen cost model. This is not realized funding evidence.
          path = "orchestration/strategy_factory_cohort_001_admission.py"
          text = read(path)
          helper = '''\n\ndef stage1_total_cost_bps(cost_model: dict[str, Any], stress_multiplier: float) -> float:\n    """Return deterministic per-trade Stage-1 drag for non-carry Cohort-001."""\n    if not isinstance(cost_model, dict):\n        raise RuntimeError("Stage-1 cost_model must be an object")\n    required = (\n        "fees_bps",\n        "spread_bps",\n        "slippage_bps",\n        "adverse_funding_allowance_bps_per_trade",\n        "stress_multipliers",\n    )\n    missing = [field for field in required if field not in cost_model]\n    if missing:\n        raise RuntimeError(f"Stage-1 cost_model missing fields: {missing}")\n    if "funding_bps_per_day" in cost_model:\n        raise RuntimeError("non-carry Stage-1 cost must not use daily funding semantics")\n    multiplier = float(stress_multiplier)\n    allowed = [float(value) for value in cost_model["stress_multipliers"]]\n    if multiplier not in allowed:\n        raise RuntimeError("Stage-1 stress multiplier is not frozen in the cost contract")\n    components = (\n        "fees_bps",\n        "spread_bps",\n        "slippage_bps",\n        "adverse_funding_allowance_bps_per_trade",\n    )\n    base = 0.0\n    for field in components:\n        value = cost_model[field]\n        if isinstance(value, bool) or not isinstance(value, (int, float)):\n            raise RuntimeError(f"Stage-1 {field} must be numeric")\n        value = float(value)\n        if value < 0:\n            raise RuntimeError(f"Stage-1 {field} must be non-negative")\n        if field == "adverse_funding_allowance_bps_per_trade" and value <= 0:\n            raise RuntimeError("Stage-1 adverse funding allowance must be strictly positive")\n        base += value\n    return base * multiplier\n'''
          text = replace_once(
              text,
              '\n\ndef _qualify_common_selection_dataset(seed: dict[str, Any]) -> dict[str, Any]:\n',
              helper + '\n\ndef _qualify_common_selection_dataset(seed: dict[str, Any]) -> dict[str, Any]:\n',
              "insert Stage-1 total-cost helper",
          )
          text = replace_once(
              text,
              '        "schema_version": 2,',
              '        "schema_version": 3,',
              "admission receipt schema version",
          )
          old = (
              '        "selection_dataset_qualification": selection_dataset,\n'
              '        "outcomes_read": False,\n'
          )
          new = (
              '        "selection_dataset_qualification": selection_dataset,\n'
              '        "stage1_cost_contract": {\n'
              '            "semantics": "adverse_per_completed_trade_allowance",\n'
              '            "applies_to": "non_carry_cohort_001_ohlcv_candidates",\n'
              '            "fees_bps": seed["common_ohlcv_contract"]["cost_model"]["fees_bps"],\n'
              '            "spread_bps": seed["common_ohlcv_contract"]["cost_model"]["spread_bps"],\n'
              '            "slippage_bps": seed["common_ohlcv_contract"]["cost_model"]["slippage_bps"],\n'
              '            "adverse_funding_allowance_bps_per_trade": seed["common_ohlcv_contract"]["cost_model"]["adverse_funding_allowance_bps_per_trade"],\n'
              '            "stress_totals_bps": {\n'
              '                f"{float(multiplier):g}x": stage1_total_cost_bps(\n'
              '                    seed["common_ohlcv_contract"]["cost_model"], multiplier\n'
              '                )\n'
              '                for multiplier in seed["common_ohlcv_contract"]["cost_model"]["stress_multipliers"]\n'
              '            },\n'
              '            "authenticated_realized_funding_evidence": False,\n'
              '            "deeper_validation_requires_pit_funding": True,\n'
              '        },\n'
              '        "outcomes_read": False,\n'
          )
          text = replace_once(text, old, new, "insert Stage-1 cost receipt")
          write(path, text)

          # Focused RED->GREEN locks. Zero and omission both fail closed; C101-H
          # retains separate carry semantics; stress totals are exact 24/48/72 bps.
          path = "tests/test_strategy_factory_cohort_001_admission.py"
          text = read(path)
          text = replace_once(
              text,
              '    assert receipt["schema_version"] == 2\n',
              '    assert receipt["schema_version"] == 3\n',
              "test receipt schema version",
          )
          if "test_cohort_001_noncarry_perpetual_cost_contract_is_adverse_and_deterministic" in text:
              raise SystemExit("focused cost tests already exist; one-shot repair must not run twice")
          text += '''\n\ndef test_cohort_001_noncarry_perpetual_cost_contract_is_adverse_and_deterministic() -> None:\n    seed = _seed()\n    common_cost = seed["common_ohlcv_contract"]["cost_model"]\n    assert common_cost["adverse_funding_allowance_bps_per_trade"] == 4.0\n    assert "funding_bps_per_day" not in common_cost\n\n    receipt = build_canonical_admission_receipt()\n    cost = receipt["stage1_cost_contract"]\n    assert cost["semantics"] == "adverse_per_completed_trade_allowance"\n    assert cost["fees_bps"] == 12.0\n    assert cost["spread_bps"] == 2.0\n    assert cost["slippage_bps"] == 6.0\n    assert cost["adverse_funding_allowance_bps_per_trade"] == 4.0\n    assert cost["stress_totals_bps"] == {"1x": 24.0, "2x": 48.0, "3x": 72.0}\n    assert cost["authenticated_realized_funding_evidence"] is False\n    assert cost["deeper_validation_requires_pit_funding"] is True\n\n    delta = next(\n        candidate\n        for candidate in seed["candidates"]\n        if candidate["fingerprint_id"] == "DISC-DELTA-CARRY-001-v1"\n    )\n    assert delta["cost_model"]["funding_bps_per_day"] == 0.0\n    assert "adverse_funding_allowance_bps_per_trade" not in delta["cost_model"]\n\n\ndef test_cohort_001_zero_or_omitted_adverse_funding_fails_closed() -> None:\n    seed = _seed()\n    candidate = next(\n        candidate\n        for candidate in seed["candidates"]\n        if candidate["fingerprint_id"] == "DISC-SIGNED-VOLUME-DRIFT-001-v1"\n    )\n    resolved = resolve_candidate_predeclaration(seed, candidate)\n\n    omitted = json.loads(json.dumps(resolved))\n    omitted["cost_model"].pop("adverse_funding_allowance_bps_per_trade")\n    try:\n        freeze_predeclaration(omitted)\n    except RuntimeError:\n        pass\n    else:\n        raise AssertionError("omitted adverse funding allowance must fail closed")\n\n    zero = json.loads(json.dumps(resolved))\n    zero["cost_model"]["adverse_funding_allowance_bps_per_trade"] = 0.0\n    try:\n        freeze_predeclaration(zero)\n    except RuntimeError:\n        pass\n    else:\n        raise AssertionError("zero adverse funding allowance must fail closed")\n'''
          write(path, text)

          # Canonical-admission workflow follows the explicit receipt schema bump.
          path = ".github/workflows/strategy_factory_cohort_001_admission.yml"
          text = read(path)
          text = replace_once(
              text,
              'assert payload["schema_version"] == 2',
              'assert payload["schema_version"] == 3',
              "workflow receipt schema assertion",
          )
          write(path, text)
          PY
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused admission and identity tests before receipt rewrite
        run: |
          python -m pytest -q \
            tests/test_strategy_factory_cohort_001_admission.py \
            tests/test_strategy_predeclaration.py \
            tests/test_scientific_design_identity.py
      - name: Regenerate canonical outcome-blind admission receipt
        run: python -m orchestration.strategy_factory_cohort_001_admission > orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json
      - name: Verify committed receipt lock after regeneration
        run: python -m pytest -q tests/test_strategy_factory_cohort_001_receipt_lock.py
      - name: Commit final bounded repair and remove one-shot helper
        shell: bash
        run: |
          git rm .github/workflows/cohort_001_cost_repair_once.yml
          git add orchestration/strategy_predeclaration.py \
                  orchestration/strategy_behavior_schema.py \
                  orchestration/strategy_behavior_value_contract.py \
                  orchestration/cohorts/strategy_factory_cohort_001_seed.json \
                  orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json \
                  orchestration/strategy_factory_cohort_001_admission.py \
                  tests/test_strategy_factory_cohort_001_admission.py \
                  .github/workflows/strategy_factory_cohort_001_admission.yml
          git commit -m "Fix Cohort-001 perpetual funding cost semantics"
          git push origin HEAD:agent/strategy-cohort-001-seed-20260921
