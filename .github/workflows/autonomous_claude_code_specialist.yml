name: Cost-Bounded Autonomous Claude Code Implementation Specialist

on:
  workflow_dispatch:
  schedule:
    - cron: "26 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: autonomous-claude-code-specialist-runner
  cancel-in-progress: false

jobs:
  specialist-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      STATE_FILE: runner_state_claude_code.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - id: meta
        name: Resolve fail-closed runner metadata
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python agents/claude_code_specialist_runner.py validate
          MAIN_SHA="$(git rev-parse HEAD)"
          STATE_BRANCH="$(python - <<'PY'
          import json
          print(json.load(open('orchestration/autonomous_specialist_runner_claude_code.json'))['policy']['state_branch'])
          PY
          )"
          test "$STATE_BRANCH" != "main" -a "$STATE_BRANCH" != "master"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "state_branch=$STATE_BRANCH" >> "$GITHUB_OUTPUT"

      - id: load_state
        name: Load durable non-main runner state
        env:
          STATE_BRANCH: ${{ steps.meta.outputs.state_branch }}
        run: |
          fetch_or_default () {
            FILE="$1"
            DEST="$2"
            if git ls-remote --exit-code --heads origin "refs/heads/$STATE_BRANCH" >/dev/null 2>&1 \
              && gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$STATE_BRANCH" --jq .content >/tmp/b64_$FILE 2>/dev/null; then
              tr -d '\n' </tmp/b64_$FILE | base64 -d >"$DEST"
            else
              python - "$DEST" <<'PY'
          import json, sys
          from agents.autonomous_cloud_runner import default_state
          json.dump(default_state(), open(sys.argv[1], 'w'), indent=2)
          PY
            fi
          }
          fetch_or_default "$STATE_FILE" /tmp/runner_state.json

      - id: reconcile
        name: Reconcile exact-head Security and Reliability state
        run: |
          PHASE="$(python - <<'PY'
          import json
          s=json.load(open('/tmp/runner_state.json'))
          a=s.get('active_task') or {}
          print(a.get('phase',''))
          PY
          )"
          if [ "$PHASE" != "WAITING_CI" ]; then
            echo "reconciled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="$(python - <<'PY'
          import json
          a=(json.load(open('/tmp/runner_state.json')).get('active_task') or {})
          print(a.get('branch',''))
          PY
          )"
          HEAD_SHA="$(python - <<'PY'
          import json
          a=(json.load(open('/tmp/runner_state.json')).get('active_task') or {})
          print(a.get('head_sha',''))
          PY
          )"
          test -n "$BRANCH" -a -n "$HEAD_SHA"
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security.yml --branch "$BRANCH" --limit 20 --json headSha,status,conclusion --jq "[.[] | select(.headSha == \"$HEAD_SHA\")][0] // {}")"
          STATUS="$(printf '%s' "$RUN" | jq -r '.status // "missing"')"
          CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // "pending"')"
          if [ "$STATUS" = "completed" ]; then
            python agents/autonomous_cloud_state.py mark-ci --state /tmp/runner_state.json --conclusion "$CONCLUSION" --head-sha "$HEAD_SHA"
            echo "reconciled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Security and Reliability still pending or missing for exact candidate head; no model run."
            echo "reconciled=false" >> "$GITHUB_OUTPUT"
          fi

      - id: plan
        name: Select at most one READY autonomous task
        run: |
          python agents/claude_code_specialist_runner.py plan \
            --state /tmp/runner_state.json \
            --main-sha '${{ steps.meta.outputs.main_sha }}' \
            --output /tmp/decision.json
          RUN="$(jq -r '.run' /tmp/decision.json)"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "role=$(jq -r '.role // ""' /tmp/decision.json)" >> "$GITHUB_OUTPUT"
          echo "task_id=$(jq -r '.task_id // ""' /tmp/decision.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.branch // ""' /tmp/decision.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason' /tmp/decision.json)" >> "$GITHUB_OUTPUT"

      - id: credential_gate
        name: Fail closed when API credential is unavailable
        if: steps.plan.outputs.run == 'true'
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            python - <<'PY'
          import json
          p='/tmp/runner_state.json'
          s=json.load(open(p)); s['paused_reason']='MISSING_ANTHROPIC_API_KEY'
          json.dump(s, open(p,'w'), indent=2, sort_keys=True)
          PY
            echo "execute=false" >> "$GITHUB_OUTPUT"
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi

      - id: fleet_budget
        name: Race-free fleet budget reservation (fails closed on any real fetch failure)
        if: steps.credential_gate.outputs.execute == 'true'
        env:
          STATE_BRANCH: ${{ steps.meta.outputs.state_branch }}
        run: |
          # Reserves against the single shared fleet_coordination.json under
          # a short-lived compare-and-swap lock, so this run and any
          # concurrent OpenAI/Claude run can never both decide against the
          # same stale snapshot (BUG_REGRESSION_LEDGER.md
          # FLEET-BUDGET-RACE-001). A genuine 404 for a sibling's state file
          # (never run yet) counts as zero spend; any other fetch failure
          # fails this reservation closed.
          python -m orchestration.shared_budget reserve \
            --config orchestration/autonomous_specialist_runner_claude_code.json \
            --role '${{ steps.plan.outputs.role }}' \
            --engine claude-code \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$STATE_BRANCH" \
            --own-state-path "$STATE_FILE" \
            --sibling-state-path runner_state.json \
            --sibling-state-path runner_state_claude.json \
            --output /tmp/fleet_reservation.json
          echo "reservation_id=$(jq -r '.reservation_id // empty' /tmp/fleet_reservation.json)" >> "$GITHUB_OUTPUT"

      - id: branch
        name: Create isolated task branch from exact current main
        if: steps.credential_gate.outputs.execute == 'true'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          MAIN_SHA: ${{ steps.meta.outputs.main_sha }}
        run: |
          test "$BRANCH" != "main" -a "$BRANCH" != "master"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Existing task branch detected (this engine's own prior run, or another engine already claimed this task); refusing to overwrite."
            exit 1
          fi
          git config user.name "autonomous-claude-code-specialist"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH" "$MAIN_SHA"

      - id: prompt
        name: Build the bounded implementation prompt for the claimed task
        if: steps.credential_gate.outputs.execute == 'true'
        env:
          ROLE: ${{ steps.plan.outputs.role }}
          TASK_ID: ${{ steps.plan.outputs.task_id }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          python - <<'PY' > /tmp/prompt.txt
          import json, os
          from agents.autonomous_cloud_runner import coordination_task, load_config, load_coordination
          from agents.claude_code_specialist_runner import CONFIG_PATH

          role = os.environ["ROLE"]
          task_id = os.environ["TASK_ID"]
          branch = os.environ["BRANCH"]
          cfg = load_config(CONFIG_PATH)
          coord = load_coordination()
          task = coordination_task(coord, task_id)
          mission = cfg["roles"][role]["mission"]
          allowed = cfg["roles"][role]["allowed_paths"]

          print(f"""You are the autonomous {role} implementation specialist on branch {branch}.
          Mission: {mission}

          Owned coordination task (from orchestration/specialist_coordination.json):
          {json.dumps(task, indent=2)}

          Read AI_STATE.md and AGENTS.md yourself before making any change; treat AI_STATE.md as
          authoritative current project state.

          Hard rules, enforced independently of anything you do here (do not rely on your own
          judgment about them -- they are checked mechanically after you finish):
          - You may write only to paths matching one of: {json.dumps(allowed)}. Anything else is
            rejected by a post-hoc allowlist check regardless of what you write.
          - Do NOT run git commit, git push, gh pr create, or any git/gh command. A separate step
            owns publication; your job is only to edit the working tree and, if useful, run pytest
            to check your own work.
          - Never edit orchestration/, agents/, .github/workflows/, AI_STATE.md, AGENTS.md,
            requirements.txt, Dockerfile, live_promotions.json, or any credential/.env file --
            these are blocked by orchestration/protected_paths.json regardless of role.
          - Preserve chronology, untouched OOS, robustness, multiple-testing protection,
            point-in-time safety, genuine-forward requirements, execution/risk gates, and
            immutable strategy fingerprints. Never weaken a validation or promotion gate.
          - Never fabricate data or evidence. Missing or insufficient evidence means the correct
            outcome is to make no change (or the smallest safe diagnostic change) rather than a
            fabricated pass.
          - Make the smallest scientifically/technically safe change that advances the owned task,
            with relevant tests. If no safe, useful change is justified, make no change.
          - Finish within your bounded turn budget; do not perform open-ended exploration.
          """)
          PY
          {
            echo "prompt<<CLAUDE_PROMPT_EOF"
            cat /tmp/prompt.txt
            echo "CLAUDE_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          MODEL="$(python -c "import json; print(json.load(open('orchestration/autonomous_specialist_runner_claude_code.json'))['roles']['${ROLE}']['model'])")"
          MAX_TURNS="$(python -c "import json; print(json.load(open('orchestration/autonomous_specialist_runner_claude_code.json'))['roles']['${ROLE}']['max_turns'])")"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"

      - id: agent
        name: Run one bounded Claude Code implementation cycle
        if: steps.credential_gate.outputs.execute == 'true'
        continue-on-error: true
        # Uses the official anthropics/claude-code-action (see
        # https://code.claude.com/docs/en/github-actions), pinned to the v1
        # tag. --allowedTools deliberately omits git/gh/general Bash access:
        # Claude Code can Read/Write/Edit files and run pytest only, so it
        # cannot commit, push, or open a PR itself even if instructed to --
        # publication stays under this workflow's own control, verified by
        # the allowlist and test steps below.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--max-turns ${{ steps.prompt.outputs.max_turns }} --model ${{ steps.prompt.outputs.model }} --allowedTools \"Read,Write,Edit,Bash(pytest*)\""

      - name: Account conservatively for failed model execution
        if: steps.credential_gate.outputs.execute == 'true' && steps.agent.outcome == 'failure'
        run: |
          python agents/autonomous_cloud_state.py mark-failure \
            --state /tmp/runner_state.json \
            --reason-code MODEL_EXECUTION_FAILURE \
            --config orchestration/autonomous_specialist_runner_claude_code.json

      - id: changes
        name: Determine whether the working tree actually changed
        if: steps.credential_gate.outputs.execute == 'true' && steps.agent.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "status=READY_FOR_PR" >> "$GITHUB_OUTPUT"
          else
            echo "status=NO_CHANGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce full repository tests before publication
        if: steps.changes.outputs.status == 'READY_FOR_PR'
        run: |
          pip install pytest
          if ! pytest -q; then
            python agents/autonomous_cloud_state.py mark-failure \
              --state /tmp/runner_state.json \
              --reason-code FULL_TEST_FAILURE \
              --config orchestration/autonomous_specialist_runner_claude_code.json
            exit 1
          fi

      - name: Reject any actual change outside the role allowlist
        if: steps.changes.outputs.status == 'READY_FOR_PR'
        env:
          ROLE: ${{ steps.plan.outputs.role }}
        run: |
          python - <<'PY'
          import os, subprocess
          from agents.autonomous_cloud_runner import load_config, path_allowed
          from agents.claude_code_specialist_runner import CONFIG_PATH
          cfg=load_config(CONFIG_PATH); role=os.environ['ROLE']
          raw=subprocess.check_output(['git','status','--porcelain','-z'])
          entries=[e.decode('utf-8','strict') for e in raw.split(b'\0') if e]
          if not entries:
              raise SystemExit('READY_FOR_PR without repository changes')
          bad=[]
          for entry in entries:
              path=entry[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              if not path_allowed(cfg, role, path):
                  bad.append(path)
          if bad:
              raise SystemExit('Autonomous change escaped role allowlist: '+', '.join(sorted(bad)))
          PY

      - id: publish
        name: Commit candidate branch and open PR without merge authority
        if: steps.changes.outputs.status == 'READY_FOR_PR'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          ROLE: ${{ steps.plan.outputs.role }}
          TASK_ID: ${{ steps.plan.outputs.task_id }}
        run: |
          git add -A
          git diff --cached --check
          git commit -m "autonomous($ROLE): $TASK_ID bounded Claude Code implementation candidate"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "autonomous($ROLE): $TASK_ID Claude Code candidate" \
            --body "Autonomous cost-bounded Claude Code implementation specialist candidate for $TASK_ID. No merge or live-trading authority. Requires exact-head Security and Reliability plus independent security/lead/claude-adversarial review plus manual Lead Integrator review. Insufficient evidence remains WAIT / RESEARCH_ONLY.")"
          PR_NUMBER="${PR_URL##*/}"
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          python agents/autonomous_cloud_state.py mark-pr \
            --state /tmp/runner_state.json \
            --branch "$BRANCH" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Record NO_CHANGE outcome
        if: steps.changes.outputs.status == 'NO_CHANGE'
        run: |
          python - <<'PY'
          import json
          p = '/tmp/runner_state.json'
          s = json.load(open(p))
          s['active_task'] = None
          json.dump(s, open(p, 'w'), indent=2, sort_keys=True)
          PY

      - name: Clear fleet budget reservation now that this run has concluded
        if: always() && steps.fleet_budget.outputs.reservation_id != ''
        env:
          STATE_BRANCH: ${{ steps.meta.outputs.state_branch }}
        run: |
          # Best effort: if this cannot complete (e.g. the runner is being
          # cancelled), the reservation's own TTL frees it for sibling
          # engines regardless -- see PENDING_RESERVATION_TTL_SECONDS.
          python -m orchestration.shared_budget clear-reservation \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$STATE_BRANCH" \
            --reservation-id '${{ steps.fleet_budget.outputs.reservation_id }}' || true

      - name: Persist sanitized durable state to non-main branch
        if: always()
        env:
          STATE_BRANCH: ${{ steps.meta.outputs.state_branch }}
        run: |
          test -f /tmp/runner_state.json || exit 0
          test "$STATE_BRANCH" != "main" -a "$STATE_BRANCH" != "master"
          if ! git ls-remote --exit-code --heads origin "refs/heads/$STATE_BRANCH" >/dev/null 2>&1; then
            git push origin '${{ steps.meta.outputs.main_sha }}':"refs/heads/$STATE_BRANCH"
          fi
          CONTENT="$(base64 -w0 /tmp/runner_state.json)"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATE_FILE?ref=$STATE_BRANCH" --jq .sha 2>/dev/null || true)"
          set +e
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE_FILE" \
              -f message='Update Claude Code specialist runner state' \
              -f content="$CONTENT" \
              -f branch="$STATE_BRANCH" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATE_FILE" \
              -f message='Initialize Claude Code specialist runner state' \
              -f content="$CONTENT" \
              -f branch="$STATE_BRANCH" >/dev/null
          fi
          WRITE_STATUS=$?
          set -e
          if [ "$WRITE_STATUS" -eq 0 ]; then
            exit 0
          fi
          echo "State write command reported failure; verifying durable state before failing."
          LOCAL_HASH="$(sha256sum /tmp/runner_state.json | awk '{print $1}')"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$STATE_FILE?ref=$STATE_BRANCH" --jq .content >/tmp/state-verify.b64 2>/dev/null; then
            tr -d '\n' </tmp/state-verify.b64 | base64 -d >/tmp/state-verify.json
            REMOTE_HASH="$(sha256sum /tmp/state-verify.json | awk '{print $1}')"
            if [ "$LOCAL_HASH" = "$REMOTE_HASH" ]; then
              echo "Durable state verified after ambiguous API response."
              exit 0
            fi
          fi
          echo "Durable state could not be verified after write failure."
          exit "$WRITE_STATUS"

      - name: Fail workflow after bounded agent failure
        if: steps.credential_gate.outputs.execute == 'true' && steps.agent.outcome == 'failure'
        run: exit 1
