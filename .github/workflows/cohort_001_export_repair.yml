name: One-shot export Cohort 001 cost repair

on:
  push:
    branches:
      - agent/strategy-cohort-001-seed-20260921
    paths:
      - .github/workflows/cohort_001_export_repair.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strategy-cohort-001-seed-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile current canonical main in workspace
        run: |
          git fetch --no-tags origin main
          git merge --no-edit origin/main
      - name: Reuse the already-reviewed deterministic repair block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/cohort_001_cost_repair_once.yml').read_text(encoding='utf-8')
          start = '      - name: Apply outcome-blind cost-semantics repair\n        shell: bash\n        run: |\n'
          end = '\n      - name: Install focused test dependency\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('repair workflow extraction anchors drifted')
          block = text.split(start, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected indentation in repair block')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          Path('/tmp/apply_repair.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply_repair.sh
      - name: Validate repair and regenerate canonical receipt
        run: |
          python -m pip install pytest
          python -m pytest -q \
            tests/test_strategy_factory_cohort_001_admission.py \
            tests/test_strategy_predeclaration.py \
            tests/test_scientific_design_identity.py
          python -m orchestration.strategy_factory_cohort_001_admission > orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json
          python -m pytest -q tests/test_strategy_factory_cohort_001_receipt_lock.py
      - name: Stage exact transformed files for export
        run: |
          mkdir -p /tmp/cohort-repair/orchestration/cohorts /tmp/cohort-repair/orchestration /tmp/cohort-repair/tests /tmp/cohort-repair/.github/workflows
          cp orchestration/strategy_predeclaration.py /tmp/cohort-repair/orchestration/
          cp orchestration/strategy_behavior_schema.py /tmp/cohort-repair/orchestration/
          cp orchestration/strategy_behavior_value_contract.py /tmp/cohort-repair/orchestration/
          cp orchestration/strategy_factory_cohort_001_admission.py /tmp/cohort-repair/orchestration/
          cp orchestration/cohorts/strategy_factory_cohort_001_seed.json /tmp/cohort-repair/orchestration/cohorts/
          cp orchestration/cohorts/strategy_factory_cohort_001_canonical_admission.json /tmp/cohort-repair/orchestration/cohorts/
          cp tests/test_strategy_factory_cohort_001_admission.py /tmp/cohort-repair/tests/
          cp .github/workflows/strategy_factory_cohort_001_admission.yml /tmp/cohort-repair/.github/workflows/
          git diff --binary > /tmp/cohort-repair/repair.patch
      - uses: actions/upload-artifact@v4
        with:
          name: cohort-001-cost-repair-exact-files
          path: /tmp/cohort-repair
          if-no-files-found: error
          retention-days: 1
