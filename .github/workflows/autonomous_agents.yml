name: Autonomous Specialist Agents

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-specialist-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install httpx pytest
      - name: Fail closed unless agent credentials are configured
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY missing"; exit 1; }
          test -n "$OPENAI_AGENT_MODEL" || { echo "OPENAI_AGENT_MODEL missing"; exit 1; }
      - name: Collect GitHub context
        run: |
          {
            echo "Recent workflow runs:"
            gh run list --repo "$GITHUB_REPOSITORY" --limit 15 || true
            echo
            echo "Open pull requests:"
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 30 || true
          } > /tmp/github-context.txt
      - id: plan
        name: Generate fail-closed specialist plan
        run: |
          export AGENT_EXTERNAL_CONTEXT="$(cat /tmp/github-context.txt)"
          python agents/autonomous_orchestrator.py plan --output /tmp/agent-plan.json
          echo "plan_b64=$(base64 -w0 /tmp/agent-plan.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/agent-plan.json

  specialists:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role:
          - quant-research
          - data-market
          - strategy-registry
          - production-risk
          - testing-security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_MAX_STEPS: "20"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and agent runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Restore plan
        run: echo '${{ needs.plan.outputs.plan_b64 }}' | base64 -d > /tmp/agent-plan.json
      - name: Create isolated cycle branch
        id: branch
        run: |
          SAFE_ROLE="${{ matrix.role }}"
          BRANCH="auto/${SAFE_ROLE}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "autonomous-${SAFE_ROLE}"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Execute specialist task
        run: python agents/autonomous_worker.py --role '${{ matrix.role }}' --plan /tmp/agent-plan.json
      - name: Enforce full repository tests
        run: pytest -q
      - name: Remove generated Python caches
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      - name: Reject protected-path modifications
        run: |
          CHANGED="$(git status --porcelain | sed -E 's/^.. //')"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(AI_STATE\.md$|agents/|\.github/workflows/|requirements\.txt$|Dockerfile$)'; then
            echo "Protected path changed; refusing autonomous PR."
            exit 1
          fi
      - name: Commit and open PR only when there are changes
        env:
          ROLE: ${{ matrix.role }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes for $ROLE this cycle."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "autonomous($ROLE): bounded improvement"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "autonomous($ROLE): bounded improvement" \
            --body "Automated specialist proposal from role **$ROLE**.\n\nThis PR is intentionally unmerged. It must pass Security and Reliability CI plus independent Lead/Security autonomous review before any merge. AI_STATE.md and orchestration safeguards are protected from specialist writes."
