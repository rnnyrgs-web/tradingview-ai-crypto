name: Legacy Autonomous Specialist Agents (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-specialist-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_b64: ${{ steps.plan.outputs.plan_b64 }}
      active_roles: ${{ steps.plan.outputs.active_roles }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: gpt-5.6-luna
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install httpx pytest
      - name: Collect compact supervisor and GitHub context
        run: |
          {
            echo "SUPERVISOR SNAPSHOT:"
            python agents/supervisor_snapshot.py
            echo
            echo "Trigger event: $GITHUB_EVENT_NAME"
            echo
            echo "Recent workflow runs:"
            gh run list --repo "$GITHUB_REPOSITORY" --limit 15 || true
            echo
            echo "Recent autonomous branches:"
            git ls-remote --heads origin 'refs/heads/auto/*' | tail -30 || true
          } > /tmp/github-context.txt
      - id: plan
        name: Generate fail-closed specialist plan
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$OPENAI_AGENT_MODEL" ]; then
            echo "AI planner credentials unavailable; safely skipping this cycle."
            echo "active_roles=[]" >> "$GITHUB_OUTPUT"
            echo "plan_b64=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export AGENT_EXTERNAL_CONTEXT="$(cat /tmp/github-context.txt)"
          if ! python agents/autonomous_orchestrator.py plan --output /tmp/agent-plan.json; then
            echo "AI planner unavailable or quota/rate-limited; safely skipping this cycle instead of failing the workflow."
            echo "active_roles=[]" >> "$GITHUB_OUTPUT"
            echo "plan_b64=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plan_b64=$(base64 -w0 /tmp/agent-plan.json)" >> "$GITHUB_OUTPUT"
          ACTIVE_ROLES="$(python - <<'PY'
          import json
          p = json.load(open('/tmp/agent-plan.json', encoding='utf-8'))
          print(json.dumps([r for r, t in p['tasks'].items() if t['status'] == 'TASK'], separators=(',', ':')))
          PY
          )"
          echo "active_roles=$ACTIVE_ROLES" >> "$GITHUB_OUTPUT"
          echo "Active specialist roles: $ACTIVE_ROLES"
          cat /tmp/agent-plan.json

  specialists:
    needs: plan
    if: ${{ needs.plan.outputs.active_roles != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        role: ${{ fromJSON(needs.plan.outputs.active_roles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: ${{ contains(fromJSON('["testing-security","strategy-registry","portfolio-risk","production-signals"]'), matrix.role) && 'gpt-5.6-sol' || 'gpt-5.6-luna' }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_MAX_STEPS: ${{ matrix.role == 'testing-security' && '32' || '20' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and agent runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Restore plan
        run: echo '${{ needs.plan.outputs.plan_b64 }}' | base64 -d > /tmp/agent-plan.json
      - id: mode
        name: Resolve role mode
        env:
          ROLE: ${{ matrix.role }}
        run: |
          MODE="$(jq -r --arg role "$ROLE" '.tasks[$role].mode' /tmp/agent-plan.json)"
          test "$MODE" = "CHANGE" -o "$MODE" = "AUDIT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Role $ROLE mode: $MODE"
      - name: Create isolated cycle branch
        id: branch
        run: |
          SAFE_ROLE="${{ matrix.role }}"
          BRANCH="auto/${SAFE_ROLE}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "autonomous-${SAFE_ROLE}"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Execute specialist task
        run: python agents/autonomous_worker.py --role '${{ matrix.role }}' --plan /tmp/agent-plan.json
      - name: Enforce full repository tests
        if: steps.mode.outputs.mode == 'CHANGE'
        run: pytest -q
      - name: Remove generated Python caches
        if: steps.mode.outputs.mode == 'CHANGE'
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      - name: Reject protected-path modifications
        if: steps.mode.outputs.mode == 'CHANGE'
        run: |
          CHANGED="$(git status --porcelain | sed -E 's/^.. //')"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(AI_STATE\.md$|agents/|orchestration/|\.github/workflows/|requirements\.txt$|Dockerfile$)'; then
            echo "Protected path changed; refusing autonomous candidate."
            exit 1
          fi
      - name: Commit and publish candidate branch when there are changes
        if: steps.mode.outputs.mode == 'CHANGE'
        env:
          ROLE: ${{ matrix.role }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes for $ROLE this cycle."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git commit -m "autonomous($ROLE): bounded improvement"
          git push origin "$BRANCH"
          echo "Published candidate branch $BRANCH."
          echo "Dispatching Security and Reliability explicitly because pushes made with GITHUB_TOKEN do not trigger downstream push workflows."
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
