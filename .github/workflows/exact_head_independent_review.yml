name: Exact-Head Independent Review Queue

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

# One repository-wide control-plane writer prevents two bot review attempts from
# racing receipts for the same or different exact heads. Owner/admin mutation of
# GitHub state remains the explicit trusted control-plane boundary.
concurrency:
  group: exact-head-independent-review
  cancel-in-progress: false

jobs:
  review-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: gpt-5.6-sol
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_REVIEW_MODEL: claude-haiku-4-5
      AUTONOMOUS_MERGE_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install review runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: select
        name: Select oldest ready explicit exact-head review request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          SELECTED_ISSUE=""
          SELECTED_PR=""
          SELECTED_BRANCH=""
          SELECTED_SHA=""
          SELECTED_REF=""
          SECURITY_RUN_ID=""

          # Complete pagination is a security property: a terminal old receipt
          # may not disappear merely because >500 unrelated issues now exist.
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            | jq -s 'add | map(select(.pull_request == null))' \
            > /tmp/exact-head-open-requests.json
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            | jq -s 'add | map(select(.pull_request == null))' \
            > /tmp/exact-head-control-issues.json

          while IFS=$'\t' read -r ISSUE_NUMBER TITLE CREATED_AT REQUEST_AUTHOR; do
            [ -n "$ISSUE_NUMBER" ] || continue
            if [[ ! "$TITLE" =~ ^exact-head-review-request:\ pr=([0-9]+)\ sha=([0-9a-f]{40})$ ]]; then
              continue
            fi
            if [ "$REQUEST_AUTHOR" != "$REPO_OWNER" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Unauthorized exact-head review request: only repository owner $REPO_OWNER may authorize reviewer execution. Closing without invoking any model/API."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            PR_NUMBER="${BASH_REMATCH[1]}"
            REQUESTED_SHA="${BASH_REMATCH[2]}"

            PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,headRefName,headRefOid,baseRefName,isDraft,state 2>/dev/null || true)"
            if [ -z "$PR_JSON" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Review request cannot resolve PR #$PR_NUMBER; closing fail-closed. Create a new request only after the PR is resolvable."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
            PR_DRAFT="$(printf '%s' "$PR_JSON" | jq -r '.isDraft')"
            BASE_REF="$(printf '%s' "$PR_JSON" | jq -r '.baseRefName')"
            HEAD_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"
            HEAD_SHA="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')"
            if [ "$PR_STATE" != "OPEN" ] || [ "$PR_DRAFT" = "true" ] || [ "$BASE_REF" != "main" ]; then
              continue
            fi
            if [ "$HEAD_SHA" != "$REQUESTED_SHA" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Exact head moved: request=$REQUESTED_SHA current=$HEAD_SHA. This request cannot authorize a different head; closing. Create a new request for the new exact SHA after its CI is green."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi

            # Literal titles remain human-auditable, but title alone has zero
            # authority. The validator requires bot author + exact body PR/SHA/
            # source-attempt/run/outcome/authority + this canonical main SHA.
            APPROVED_TITLE="exact-head-review-approved: pr=$PR_NUMBER sha=$REQUESTED_SHA"
            REJECTED_TITLE="exact-head-review-rejected: pr=$PR_NUMBER sha=$REQUESTED_SHA"
            CONTROL_STATE="$(python -m orchestration.exact_head_control_state \
              --issues /tmp/exact-head-control-issues.json \
              --pr-number "$PR_NUMBER" \
              --head-sha "$REQUESTED_SHA" \
              --workflow-main-sha "$MAIN_SHA")"
            ALREADY_APPROVED="$(printf '%s' "$CONTROL_STATE" | jq -r '.approved')"
            ALREADY_REJECTED="$(printf '%s' "$CONTROL_STATE" | jq -r '.rejected')"
            AMBIGUOUS_CONTROL_STATE="$(printf '%s' "$CONTROL_STATE" | jq -r '.ambiguous_control_state')"
            APPROVED_ATTEMPT_COUNT="$(printf '%s' "$CONTROL_STATE" | jq '.validated_approved_attempts | length')"
            ATTEMPT_COUNT="$(printf '%s' "$CONTROL_STATE" | jq -r '.attempt_count')"

            if [ "$ALREADY_REJECTED" = "true" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Validated terminal rejection state already exists for PR #$PR_NUMBER exact head $REQUESTED_SHA. This exact SHA is terminal and cannot be reviewer-shopped; revise the candidate to a new head and pass fresh exact-head CI before requesting another scientific review."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            if [ "$AMBIGUOUS_CONTROL_STATE" = "true" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Ambiguous duplicate exact-head review control receipts exist for PR #$PR_NUMBER SHA $REQUESTED_SHA. Closing fail-closed without invoking reviewers; repair the durable control state or revise to a new exact head."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            if [ "$ALREADY_APPROVED" = "true" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "A validated approval receipt already exists for PR #$PR_NUMBER exact head $REQUESTED_SHA; closing duplicate request."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            if [ "$APPROVED_ATTEMPT_COUNT" -gt 0 ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "A validated approved source attempt exists for PR #$PR_NUMBER exact head $REQUESTED_SHA but no unique verified approval receipt exists. Closing fail-closed without rerunning reviewers; repair receipt persistence or revise to a new head."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi
            if [ "$ATTEMPT_COUNT" -ge 3 ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Bounded reviewer retry limit reached for PR #$PR_NUMBER exact head $REQUESTED_SHA after $ATTEMPT_COUNT validated attempts. Closing without approval; create a new request only after the provider/runtime blocker is materially resolved."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi

            REVIEW_REF="refs/remotes/origin/review-pr/$PR_NUMBER"
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:$REVIEW_REF"
            FETCHED_SHA="$(git rev-parse "$REVIEW_REF")"
            if [ "$FETCHED_SHA" != "$REQUESTED_SHA" ]; then
              echo "PR #$PR_NUMBER fetch mismatch; request stays pending."
              continue
            fi
            MERGE_BASE="$(git merge-base origin/main "$REVIEW_REF" 2>/dev/null || true)"
            if [ "$MERGE_BASE" != "$MAIN_SHA" ]; then
              echo "PR #$PR_NUMBER exact head is not based on current main; request stays pending."
              continue
            fi

            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Security and Reliability' --commit "$REQUESTED_SHA" --limit 20 --json databaseId,status,conclusion,headSha,createdAt)"
            MATCH="$(printf '%s' "$RUNS" | jq -c --arg sha "$REQUESTED_SHA" '[.[] | select(.headSha == $sha and .status == "completed")] | sort_by(.createdAt) | reverse | .[0] // empty')"
            if [ -z "$MATCH" ]; then
              echo "PR #$PR_NUMBER has no completed exact-head Security and Reliability run yet; request stays pending."
              continue
            fi
            CONCLUSION="$(printf '%s' "$MATCH" | jq -r '.conclusion // ""')"
            RUN_ID="$(printf '%s' "$MATCH" | jq -r '.databaseId')"
            if [ "$CONCLUSION" != "success" ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Exact-head Security and Reliability run $RUN_ID concluded $CONCLUSION for $REQUESTED_SHA. Review models were not invoked. Closing as REVISION_REQUIRED; a repaired head needs a new request."
              gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
              continue
            fi

            SELECTED_ISSUE="$ISSUE_NUMBER"
            SELECTED_PR="$PR_NUMBER"
            SELECTED_BRANCH="$HEAD_BRANCH"
            SELECTED_SHA="$REQUESTED_SHA"
            SELECTED_REF="$REVIEW_REF"
            SECURITY_RUN_ID="$RUN_ID"
            break
          done < <(jq -r 'sort_by(.created_at)[] | [.number, .title, .created_at, (.user.login // "")] | @tsv' /tmp/exact-head-open-requests.json)

          echo "request_issue=$SELECTED_ISSUE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$SELECTED_PR" >> "$GITHUB_OUTPUT"
          echo "branch=$SELECTED_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "review_ref=$SELECTED_REF" >> "$GITHUB_OUTPUT"
          echo "security_run_id=$SECURITY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$SELECTED_PR" ]; then
            echo "No explicit exact-head review request is ready."
          else
            echo "Selected PR #$SELECTED_PR ($SELECTED_BRANCH) exact head $SELECTED_SHA with Security and Reliability run $SECURITY_RUN_ID."
          fi

      - name: Stop when no review request is ready
        if: steps.select.outputs.pr_number == ''
        run: echo "Queue has no ready explicit exact-head request; no model/API review was invoked."

      - id: attempt
        name: Record exact-head review attempt
        if: steps.select.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
          BRANCH: ${{ steps.select.outputs.branch }}
          SECURITY_RUN_ID: ${{ steps.select.outputs.security_run_id }}
          MAIN_SHA: ${{ steps.select.outputs.main_sha }}
        run: |
          set -euo pipefail
          cat >/tmp/exact-head-review-attempt.md <<EOF
          PR: #$PR_NUMBER
          Candidate branch: \`$BRANCH\`
          Exact reviewed SHA: \`$HEAD_SHA\`
          Exact-head Security and Reliability run: \`$SECURITY_RUN_ID\`
          Workflow run: \`$GITHUB_RUN_ID\`
          Workflow main SHA: \`$MAIN_SHA\`
          Outcome: \`STARTED\`
          Integration authority: \`NONE\`
          EOF
          URL="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "exact-head-review-attempt: pr=$PR_NUMBER sha=$HEAD_SHA run=$GITHUB_RUN_ID" --body-file /tmp/exact-head-review-attempt.md)"
          echo "issue=${URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless all independent reviewer credentials are available
        if: steps.select.outputs.pr_number != ''
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY missing; no reviewer invoked."; exit 1; }
          test -n "$OPENAI_AGENT_MODEL" || { echo "OPENAI_AGENT_MODEL missing; no reviewer invoked."; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY missing; no reviewer invoked."; exit 1; }
          test -n "$ANTHROPIC_REVIEW_MODEL" || { echo "ANTHROPIC_REVIEW_MODEL missing; no reviewer invoked."; exit 1; }

      - name: Fetch and bound exact PR diff without branch-prefix assumptions
        if: steps.select.outputs.pr_number != ''
        env:
          REVIEW_REF: ${{ steps.select.outputs.review_ref }}
        run: |
          git diff --binary origin/main..."$REVIEW_REF" > /tmp/candidate.diff
          BYTES="$(wc -c < /tmp/candidate.diff)"
          echo "Diff bytes: $BYTES"
          test "$BYTES" -gt 0
          test "$BYTES" -le 256000 || { echo "Diff too large for one coherent exact-head review; fail closed and split the PR."; exit 1; }

      - id: review_models
        name: Run independent exact-head reviewers with bounded transient WAIT
        if: steps.select.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          is_transient_reviewer_failure() {
            python - "$1" <<'PY'
          import pathlib
          import re
          import sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          transient = re.search(r"429 Too Many Requests|rate[ -]?limit|temporarily unavailable|overloaded", text, re.I)
          raise SystemExit(0 if transient else 1)
          PY
          }

          STATUS=0
          WAIT=0
          set +e
          python -m orchestration.exact_head_review review --reviewer claude-adversarial --diff /tmp/candidate.diff --output /tmp/claude-adversarial-review.json --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" >/tmp/claude-review.log 2>&1 &
          PID_CLAUDE=$!

          python -m orchestration.exact_head_review review --reviewer security --diff /tmp/candidate.diff --output /tmp/security-review.json --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" 2>&1 | tee /tmp/security-review.log
          SECURITY_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$SECURITY_STATUS" -ne 0 ]; then
            if is_transient_reviewer_failure /tmp/security-review.log; then WAIT=1; else STATUS=1; fi
          fi

          if [ "$STATUS" -eq 0 ] && [ "$WAIT" -eq 0 ]; then
            set +e
            python -m orchestration.exact_head_review review --reviewer lead --diff /tmp/candidate.diff --output /tmp/lead-review.json --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" 2>&1 | tee /tmp/lead-review.log
            LEAD_STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$LEAD_STATUS" -ne 0 ]; then
              if is_transient_reviewer_failure /tmp/lead-review.log; then WAIT=1; else STATUS=1; fi
            fi
          fi

          # Every reviewer that was actually launched is joined before the one
          # shared deterministic rejection predicate is evaluated.
          set +e
          wait "$PID_CLAUDE"
          CLAUDE_STATUS=$?
          set -e
          cat /tmp/claude-review.log
          if [ "$CLAUDE_STATUS" -ne 0 ]; then
            if is_transient_reviewer_failure /tmp/claude-review.log; then WAIT=1; else STATUS=1; fi
          fi

          REJECTED="$(python - <<'PY'
          import json
          from pathlib import Path
          from orchestration.exact_head_review import has_terminal_rejection

          verdicts = []
          for path in (Path('/tmp/security-review.json'), Path('/tmp/lead-review.json'), Path('/tmp/claude-adversarial-review.json')):
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError, json.JSONDecodeError):
                  value = None
              verdicts.append(value if isinstance(value, dict) else None)
          print('1' if has_terminal_rejection(verdicts) else '0')
          PY
          )"
          if [ "$REJECTED" -eq 1 ]; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            echo "wait=false" >> "$GITHUB_OUTPUT"
            echo "A valid independent scientific rejection is terminal for this exact SHA and takes precedence over any transient provider absence."
            exit 0
          fi

          echo "rejected=false" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "wait=false" >> "$GITHUB_OUTPUT"
            exit "$STATUS"
          fi
          if [ "$WAIT" -eq 1 ]; then
            echo "wait=true" >> "$GITHUB_OUTPUT"
            echo "Transient reviewer throttling/overload detected with no valid rejection; exact head remains unapproved and may retry only within the bounded attempt limit."
            exit 0
          fi
          echo "wait=false" >> "$GITHUB_OUTPUT"

      - name: Record controlled WAIT for transient reviewer capacity
        if: steps.select.outputs.pr_number != '' && steps.review_models.outputs.wait == 'true'
        run: |
          {
            echo "### Controlled WAIT — independent reviewer capacity"
            echo "- Candidate remains **unapproved** and **unmerged**."
            echo "- No valid scientific rejection was produced in this attempt."
            echo "- No scientific, security, or exact-head gate was weakened."
            echo "- The same explicit request may retry on a later queue cycle, bounded to three attempts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop terminally on any valid independent rejection
        if: steps.select.outputs.pr_number != '' && steps.review_models.outputs.rejected == 'true'
        run: |
          echo "At least one independent reviewer produced a valid rejection. This exact SHA is terminal and cannot be reviewer-shopped."
          exit 1

      - name: Require all three independent reviewers to approve
        if: steps.select.outputs.pr_number != '' && steps.review_models.outputs.wait != 'true' && steps.review_models.outputs.rejected != 'true'
        run: |
          jq -e '.approve == true and .integration_authority == "NONE"' /tmp/security-review.json
          jq -e '.approve == true and .integration_authority == "NONE"' /tmp/lead-review.json
          jq -e '.approve == true and .integration_authority == "NONE"' /tmp/claude-adversarial-review.json

      - id: approval_record
        name: Create provisional exact-head approval receipt
        if: steps.select.outputs.pr_number != '' && steps.review_models.outputs.wait != 'true' && steps.review_models.outputs.rejected != 'true'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
          BRANCH: ${{ steps.select.outputs.branch }}
          SECURITY_RUN_ID: ${{ steps.select.outputs.security_run_id }}
          MAIN_SHA: ${{ steps.select.outputs.main_sha }}
          ATTEMPT_ISSUE: ${{ steps.attempt.outputs.issue }}
        run: |
          set -euo pipefail
          PROTECTED_COUNT="$(jq '.protected_paths | length' /tmp/security-review.json)"
          if [ "$PROTECTED_COUNT" -gt 0 ]; then
            OUTCOME="REVIEW_APPROVED_PROTECTED_LEAD_INTEGRATION_REQUIRED"
          else
            OUTCOME="REVIEW_APPROVED_LEAD_INTEGRATION_REQUIRED"
          fi
          PROTECTED_PATHS="$(jq -c '.protected_paths' /tmp/security-review.json)"
          {
            echo "PR: #$PR_NUMBER"
            echo "Candidate branch: \`$BRANCH\`"
            echo "Exact reviewed SHA: \`$HEAD_SHA\`"
            echo "Exact-head Security and Reliability run: \`$SECURITY_RUN_ID\` — PASS"
            echo "Source attempt issue: #$ATTEMPT_ISSUE"
            echo "Source workflow run: \`$GITHUB_RUN_ID\`"
            echo "Workflow main SHA: \`$MAIN_SHA\`"
            echo "Outcome: \`$OUTCOME\`"
            echo "Protected paths: \`$PROTECTED_PATHS\`"
            echo "Integration authority: \`NONE\`"
            echo
            echo "Security reviewer:"
            echo '```json'; cat /tmp/security-review.json; echo '```'
            echo
            echo "Lead reviewer:"
            echo '```json'; cat /tmp/lead-review.json; echo '```'
            echo
            echo "Claude adversarial reviewer:"
            echo '```json'; cat /tmp/claude-adversarial-review.json; echo '```'
            echo
            echo "This is read-only exact-head review evidence. Any new head SHA invalidates this receipt."
          } >/tmp/exact-head-review-approved.md
          URL="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "exact-head-review-approved: pr=$PR_NUMBER sha=$HEAD_SHA" --body-file /tmp/exact-head-review-approved.md)"
          RECEIPT_ISSUE="${URL##*/}"
          test -n "$RECEIPT_ISSUE"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "receipt_issue=$RECEIPT_ISSUE" >> "$GITHUB_OUTPUT"

      - name: Finalize durable attempt receipt and bound retries
        if: always() && steps.attempt.outputs.issue != ''
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
          BRANCH: ${{ steps.select.outputs.branch }}
          SECURITY_RUN_ID: ${{ steps.select.outputs.security_run_id }}
          MAIN_SHA: ${{ steps.select.outputs.main_sha }}
          REQUEST_ISSUE: ${{ steps.select.outputs.request_issue }}
          ATTEMPT_ISSUE: ${{ steps.attempt.outputs.issue }}
          APPROVAL_OUTCOME: ${{ steps.approval_record.outputs.outcome }}
          APPROVAL_RECEIPT_ISSUE: ${{ steps.approval_record.outputs.receipt_issue }}
          CONTROLLED_WAIT: ${{ steps.review_models.outputs.wait }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from orchestration.exact_head_review import classify_review_attempt_outcome

          review_paths = [Path('/tmp/security-review.json'), Path('/tmp/lead-review.json'), Path('/tmp/claude-adversarial-review.json')]
          verdicts = []
          for path in review_paths:
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, ValueError, AttributeError, json.JSONDecodeError):
                  value = None
              verdicts.append(value if isinstance(value, dict) else None)

          outcome = classify_review_attempt_outcome(
              verdicts,
              controlled_wait=os.environ.get('CONTROLLED_WAIT', '').lower() == 'true',
              approved_outcome=os.environ.get('APPROVAL_OUTCOME', ''),
          )
          lines = [
              f"PR: #{os.environ['PR_NUMBER']}",
              f"Candidate branch: `{os.environ['BRANCH']}`",
              f"Exact reviewed SHA: `{os.environ['HEAD_SHA']}`",
              f"Exact-head Security and Reliability run: `{os.environ['SECURITY_RUN_ID']}`",
              f"Workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"Workflow main SHA: `{os.environ['MAIN_SHA']}`",
              f"Outcome: `{outcome}`",
              "Integration authority: `NONE`",
          ]
          labels = ['Security reviewer', 'Lead reviewer', 'Claude adversarial reviewer']
          for label, value in zip(labels, verdicts):
              if value is not None:
                  lines += ['', f'{label}:', '```json', json.dumps(value, indent=2, sort_keys=True), '```']
          Path('/tmp/exact-head-review-attempt.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('/tmp/exact-head-review-outcome.txt').write_text(outcome + '\n', encoding='utf-8')
          PY

          gh issue edit "$ATTEMPT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/exact-head-review-attempt.md
          OUTCOME="$(cat /tmp/exact-head-review-outcome.txt)"

          # Persisted source attempt is the primary crash-safe terminal evidence.
          # Secondary rejection receipts are audit/index artifacts only; they
          # can strengthen auditability but never create or erase rejection.
          gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            | jq -s 'add | map(select(.pull_request == null))' \
            > /tmp/exact-head-control-issues-after-attempt.json
          SOURCE_STATE="$(python -m orchestration.exact_head_control_state \
            --issues /tmp/exact-head-control-issues-after-attempt.json \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --workflow-main-sha "$MAIN_SHA")"

          if [ "$OUTCOME" = "REJECTED" ]; then
            test "$(printf '%s' "$SOURCE_STATE" | jq -r '.rejected')" = "true"
            SOURCE_MATCH="$(printf '%s' "$SOURCE_STATE" | jq --argjson issue "$ATTEMPT_ISSUE" '[.validated_rejected_attempts[] | select(. == $issue)] | length')"
            test "$SOURCE_MATCH" -eq 1
            EXISTING_RECEIPTS="$(printf '%s' "$SOURCE_STATE" | jq '.validated_rejection_receipts | length')"
            CREATED_REJECTION=""
            if [ "$EXISTING_RECEIPTS" -eq 0 ]; then
              cat >/tmp/exact-head-review-rejected.md <<EOF
          PR: #$PR_NUMBER
          Candidate branch: \`$BRANCH\`
          Exact rejected SHA: \`$HEAD_SHA\`
          Source attempt issue: #$ATTEMPT_ISSUE
          Source workflow run: \`$GITHUB_RUN_ID\`
          Workflow main SHA: \`$MAIN_SHA\`
          Outcome: \`REJECTED\`
          Integration authority: \`NONE\`

          At least one independent reviewer produced a valid scientific rejection. This exact SHA is terminal for review and cannot be retried to seek a different model judgment.
          EOF
              if REJECTION_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "exact-head-review-rejected: pr=$PR_NUMBER sha=$HEAD_SHA" --body-file /tmp/exact-head-review-rejected.md 2>/tmp/exact-head-rejection-receipt-error.log)"; then
                CREATED_REJECTION="${REJECTION_URL##*/}"
                test -n "$CREATED_REJECTION"
              else
                echo "Secondary rejection receipt creation failed; persisted rejected source attempt remains terminal." >&2
                cat /tmp/exact-head-rejection-receipt-error.log >&2 || true
              fi
            fi

            gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              | jq -s 'add | map(select(.pull_request == null))' \
              > /tmp/exact-head-control-issues-after-receipt.json
            VERIFIED_STATE="$(python -m orchestration.exact_head_control_state \
              --issues /tmp/exact-head-control-issues-after-receipt.json \
              --pr-number "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --workflow-main-sha "$MAIN_SHA")"
            test "$(printf '%s' "$VERIFIED_STATE" | jq -r '.rejected')" = "true"
            VERIFIED_SOURCE_MATCH="$(printf '%s' "$VERIFIED_STATE" | jq --argjson issue "$ATTEMPT_ISSUE" '[.validated_rejected_attempts[] | select(. == $issue)] | length')"
            test "$VERIFIED_SOURCE_MATCH" -eq 1
            if [ -n "$CREATED_REJECTION" ]; then
              CREATED_MATCH="$(printf '%s' "$VERIFIED_STATE" | jq --argjson issue "$CREATED_REJECTION" '[.validated_rejection_receipts[] | select(. == $issue)] | length')"
              test "$CREATED_MATCH" -eq 1
            fi
          elif [[ "$OUTCOME" == REVIEW_APPROVED_* ]]; then
            test "$(printf '%s' "$SOURCE_STATE" | jq -r '.rejected')" = "false"
            SOURCE_MATCH="$(printf '%s' "$SOURCE_STATE" | jq --argjson issue "$ATTEMPT_ISSUE" '[.validated_approved_attempts[] | select(. == $issue)] | length')"
            test "$SOURCE_MATCH" -eq 1
            test -n "$APPROVAL_RECEIPT_ISSUE"

            gh api --paginate "/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              | jq -s 'add | map(select(.pull_request == null))' \
              > /tmp/exact-head-control-issues-after-approval.json
            VERIFIED_STATE="$(python -m orchestration.exact_head_control_state \
              --issues /tmp/exact-head-control-issues-after-approval.json \
              --pr-number "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" \
              --workflow-main-sha "$MAIN_SHA")"
            test "$(printf '%s' "$VERIFIED_STATE" | jq -r '.approved')" = "true"
            test "$(printf '%s' "$VERIFIED_STATE" | jq -r '.rejected')" = "false"
            test "$(printf '%s' "$VERIFIED_STATE" | jq -r '.ambiguous_control_state')" = "false"
            RECEIPT_MATCH="$(printf '%s' "$VERIFIED_STATE" | jq --argjson issue "$APPROVAL_RECEIPT_ISSUE" '[.validated_approval_receipts[] | select(. == $issue)] | length')"
            test "$RECEIPT_MATCH" -eq 1
          fi

          if gh issue view "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' | grep -qx OPEN; then
            if [ "$OUTCOME" = "WAIT_RETRYABLE" ]; then
              gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Review attempt finished as WAIT_RETRYABLE because an independent reviewer provider was throttled/unavailable and no valid rejection was produced. Candidate remains unapproved. Request stays open for a later bounded retry (maximum three attempts)."
            elif [ "$OUTCOME" = "REJECTED" ]; then
              gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Review attempt finished as REJECTED. A validated independent rejection is durably bound to this exact SHA; revise the candidate to a new head and pass fresh exact-head CI before requesting another scientific review."
              gh issue close "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY"
            elif [[ "$OUTCOME" == REVIEW_APPROVED_* ]]; then
              gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Exact-head independent review completed with $OUTCOME. The unique approval receipt was re-read and validated against source attempt #$ATTEMPT_ISSUE on canonical reviewer main $MAIN_SHA."
              gh issue close "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY"
            else
              gh issue comment "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Review attempt finished as $OUTCOME. This request is closed to prevent unbounded paid retries. FAILED indicates missing/invalid infrastructure evidence rather than a scientific rejection; retry the same SHA only after the objective runtime cause is materially repaired and under the bounded attempt limit."
              gh issue close "$REQUEST_ISSUE" --repo "$GITHUB_REPOSITORY"
            fi
          fi
          {
            echo "### Exact-head independent review"
            echo "- PR: #$PR_NUMBER"
            echo "- SHA: $HEAD_SHA"
            echo "- Security and Reliability: PASS ($SECURITY_RUN_ID)"
            echo "- Outcome: $OUTCOME"
            echo "- Integration authority: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
