name: Research Engines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_engines/**"
      - "requirements-research.txt"
      - "tests/test_research_engine*.py"
      - ".github/workflows/research-engines.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research engines
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements-research.txt
      - name: Contract and fail-closed tests
        run: pytest -q tests/test_research_engines.py tests/test_research_engine_runners.py
      - name: Compile adapters
        run: python -m compileall -q research_engines
      - name: Prove Python research engines are installed
        run: |
          python - <<'PY'
          from research_engines.availability import engine_availability
          state = engine_availability()
          assert state["vectorbt"]["available"], state
          assert state["nautilus"]["available"], state
          print(state)
          PY

  lean-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout open-source LEAN
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          path: .lean-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build LEAN Launcher from source
        run: dotnet build .lean-source/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release --no-restore || dotnet build .lean-source/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release
      - id: lean
        name: Resolve credential-free LEAN launcher
        run: |
          DLL="$(find .lean-source/Launcher/bin/Release -name 'QuantConnect.Lean.Launcher.dll' -print -quit)"
          test -n "$DLL"
          echo "launcher=$DLL" >> "$GITHUB_OUTPUT"
          echo "Open-source LEAN built without QuantConnect account credentials"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove research preflight accepts source-built LEAN
        env:
          LEAN_LAUNCHER_DLL: ${{ steps.lean.outputs.launcher }}
        run: |
          python - <<'PY'
          from research_engines.availability import lean_runtime
          state = lean_runtime()
          assert state["available"], state
          assert state["mode"] == "source_launcher", state
          print(state)
          PY
