name: Research Engines\n\non:\n  workflow_dispatch:\n  pull_request:\n    paths:\n      - "research_engines/**"\n      - "requirements-research.txt"\n      - "tests/test_research_engine*.py"\n      - ".github/workflows/research-engines.yml"\n\npermissions:\n  contents: read\n\njobs:\n  adapter-contract:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Install research engines\n        run: |\n          python -m pip install --upgrade pip\n          pip install pytest -r requirements-research.txt\n      - name: Contract and fail-closed tests\n        run: pytest -q tests/test_research_engines.py tests/test_research_engine_runners.py\n      - name: Compile adapters\n        run: python -m compileall -q research_engines\n      - name: Prove Python research engines are installed\n        run: |\n          python - <<'PY'\n          from research_engines.availability import engine_availability\n          state = engine_availability()\n          assert state["vectorbt"]["available"], state\n          assert state["nautilus"]["available"], state\n          print(state)\n          PY\n\n  three-engine-proof:\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@v4\n      - name: Checkout open-source LEAN\n        uses: actions/checkout@v4\n        with:\n          repository: QuantConnect/Lean\n          path: .lean-source\n      - uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: "9.0.x"\n      - name: Install frozen-path LEAN fixture\n        run: cp research_engines/lean_fixture/FrozenPathResearchAlgorithm.cs .lean-source/Algorithm.CSharp/FrozenPathResearchAlgorithm.cs\n      - name: Build LEAN Launcher and fixture algorithm from source\n        run: |\n          dotnet build .lean-source/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release\n          dotnet build .lean-source/Algorithm.CSharp/QuantConnect.Algorithm.CSharp.csproj --configuration Release\n      - id: lean\n        name: Resolve credential-free LEAN artifacts\n        run: |\n          LAUNCHER="$(find .lean-source/Launcher/bin/Release -name 'QuantConnect.Lean.Launcher.dll' -print -quit)"\n          ALGORITHM="$(find .lean-source/Algorithm.CSharp/bin/Release -name 'QuantConnect.Algorithm.CSharp.dll' -print -quit)"\n          test -n "$LAUNCHER"\n          test -n "$ALGORITHM"\n          test -f .lean-source/Data/equity/usa/hour/spy.zip\n          echo "launcher=$LAUNCHER" >> "$GITHUB_OUTPUT"\n          echo "algorithm=$ALGORITHM" >> "$GITHUB_OUTPUT"\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Install Python research engines\n        run: |\n          python -m pip install --upgrade pip\n          pip install -r requirements-research.txt\n      - name: Prove source-built LEAN preflight\n        env:\n          LEAN_LAUNCHER_DLL: ${{ steps.lean.outputs.launcher }}\n        run: |\n          python - <<'PY'\n          from research_engines.availability import lean_runtime\n          state = lean_runtime()\n          assert state["available"], state\n          assert state["mode"] == "source_launcher", state\n          print(state)\n          PY\n      - name: Execute and reconcile VectorBT Nautilus and LEAN\n        run: |\n          mkdir -p research_output/lean-ci\n          python -m research_engines.ci_three_engine \\n            --spy-zip .lean-source/Data/equity/usa/hour/spy.zip \\n            --launcher-dll "${{ steps.lean.outputs.launcher }}" \\n            --lean-config .lean-source/Launcher/config.json \\n            --algorithm-dll "${{ steps.lean.outputs.algorithm }}" \\n            --data-folder .lean-source/Data \\n            --work-dir research_output/lean-ci\n      - name: Upload immutable three-engine evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: three-engine-frozen-path-${{ github.run_id }}\n          path: research_output/lean-ci\n          retention-days: 30\n          if-no-files-found: warn\n