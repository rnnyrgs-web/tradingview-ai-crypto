name: Research Engines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_engines/**"
      - "requirements-research.txt"
      - "tests/test_research_engine*.py"
      - ".github/workflows/research-engines.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research engines
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements-research.txt
      - name: Contract and fail-closed tests
        run: pytest -q tests/test_research_engines.py tests/test_research_engine_runners.py
      - name: Compile adapters
        run: python -m compileall -q research_engines
      - name: Prove Python research engines are installed
        run: |
          python - <<'PY'
          from research_engines.availability import engine_availability
          state = engine_availability()
          assert state["vectorbt"]["available"], state
          assert state["nautilus"]["available"], state
          print(state)
          PY

  three-engine-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout open-source LEAN
        uses: actions/checkout@v4
        with:
          repository: QuantConnect/Lean
          path: .lean-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install frozen-path LEAN fixture
        run: cp research_engines/lean_fixture/FrozenPathResearchAlgorithm.cs .lean-source/Algorithm.CSharp/FrozenPathResearchAlgorithm.cs
      - name: Build LEAN Launcher and fixture algorithm from source
        run: |
          dotnet build .lean-source/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release
          dotnet build .lean-source/Algorithm.CSharp/QuantConnect.Algorithm.CSharp.csproj --configuration Release
      - id: lean
        name: Resolve credential-free LEAN artifacts
        run: |
          LAUNCHER="$(find .lean-source/Launcher/bin/Release -name 'QuantConnect.Lean.Launcher.dll' -print -quit)"
          ALGORITHM="$(find .lean-source/Algorithm.CSharp/bin/Release -name 'QuantConnect.Algorithm.CSharp.dll' -print -quit)"
          test -n "$LAUNCHER"
          test -n "$ALGORITHM"
          test -f .lean-source/Data/equity/usa/hour/spy.zip
          echo "launcher=$LAUNCHER" >> "$GITHUB_OUTPUT"
          echo "algorithm=$ALGORITHM" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python research engines
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
      - name: Prove source-built LEAN preflight
        env:
          LEAN_LAUNCHER_DLL: ${{ steps.lean.outputs.launcher }}
        run: |
          python - <<'PY'
          from research_engines.availability import lean_runtime
          state = lean_runtime()
          assert state["available"], state
          assert state["mode"] == "source_launcher", state
          print(state)
          PY
      - name: Execute and reconcile VectorBT Nautilus and LEAN
        run: |
          mkdir -p research_output/lean-ci
          python -m research_engines.ci_three_engine \
            --spy-zip .lean-source/Data/equity/usa/hour/spy.zip \
            --launcher-dll "${{ steps.lean.outputs.launcher }}" \
            --lean-config .lean-source/Launcher/config.json \
            --algorithm-dll "${{ steps.lean.outputs.algorithm }}" \
            --data-folder .lean-source/Data \
            --work-dir research_output/lean-ci
      - name: Upload immutable three-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-engine-frozen-path-${{ github.run_id }}
          path: research_output/lean-ci
          retention-days: 30
          if-no-files-found: warn
