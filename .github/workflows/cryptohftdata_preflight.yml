name: CryptoHFTData Pre-Outcome Source Verification

on:
  push:
    branches:
      - lead/coord-disc-data-003-deterministic
    paths:
      - tools/verify_cryptohftdata_preflight.py
      - tests/test_verify_cryptohftdata_preflight.py
      - .github/workflows/cryptohftdata_preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptohftdata-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      CRYPTOHFTDATA_MIN_INTERVAL_SECONDS: "1.05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic verifier dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyarrow
      - name: Run verifier unit tests
        run: pytest -q tests/test_verify_cryptohftdata_preflight.py
      - name: Run pre-outcome source verification
        id: verify
        continue-on-error: true
        run: |
          python tools/verify_cryptohftdata_preflight.py \
            --output-json artifacts/research/cryptohftdata_preflight_report.json \
            --output-md artifacts/research/cryptohftdata_preflight_report.md
      - name: Upload immutable verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptohftdata-preflight-${{ github.sha }}
          path: |
            artifacts/research/cryptohftdata_preflight_report.json
            artifacts/research/cryptohftdata_preflight_report.md
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on technical sample defects
        if: steps.verify.outcome != 'success'
        run: exit 1
