name: Crypto 15m Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "engine.py"
      - "opportunity_engine.py"
      - "db.py"
      - ".github/workflows/crypto_scan.yml"

permissions:
  contents: read

concurrency:
  group: production-crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Evaluation is useful but must never consume most of the scan window.
      # Keep it best-effort and bounded so a slow /evaluate endpoint cannot
      # starve the production scan.
      - name: Evaluate previous signals
        continue-on-error: true
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 45 \
            -H "X-Scan-Secret: ${{ secrets.SCAN_SECRET }}" \
            "https://tradingview-ai-crypto.onrender.com/evaluate" || true

      - name: Run production market scan
        run: |
          rm -f /tmp/scan-response.json
          curl --fail --show-error --silent \
            --connect-timeout 15 \
            --retry 2 --retry-delay 8 --retry-all-errors \
            --max-time 360 \
            -H "X-Scan-Secret: ${{ secrets.SCAN_SECRET }}" \
            "https://tradingview-ai-crypto.onrender.com/scan" \
            --output /tmp/scan-response.json
          test -s /tmp/scan-response.json
          python tools/validate_scan_response.py /tmp/scan-response.json

      - name: Upload safe scan diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-scan-response-${{ github.run_id }}
          path: /tmp/scan-response.json
          retention-days: 7
          if-no-files-found: ignore
