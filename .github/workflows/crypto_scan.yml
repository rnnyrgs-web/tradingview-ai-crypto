name: Crypto 15m Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger crypto scanner
        env:
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
        run: |
          curl --fail --show-error --silent --max-time 120 \
            "https://tradingview-ai-crypto.onrender.com/scan?secret=${SCAN_SECRET}"
