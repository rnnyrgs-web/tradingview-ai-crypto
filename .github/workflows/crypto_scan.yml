name: Crypto 15m Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run V2 market scan
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "X-Scan-Secret: ${{ secrets.SCAN_SECRET }}" \
            "https://tradingview-ai-crypto.onrender.com/scan"

      - name: Evaluate previous signals
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "X-Scan-Secret: ${{ secrets.SCAN_SECRET }}" \
            "https://tradingview-ai-crypto.onrender.com/evaluate"
