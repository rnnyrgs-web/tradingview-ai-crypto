name: Security and Reliability

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit
      - name: Unit tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r . -x ./tests
      - name: Reject obvious committed secrets
        run: python security_secret_scan.py
