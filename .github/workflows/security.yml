name: Security and Reliability

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit
      - name: Unit tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r . -x ./tests
      - name: Reject obvious committed secrets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = [
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r'''SUPABASE_SECRET_KEY\s*=\s*["'][^"']+["']'''),
              re.compile(r'''SCAN_SECRET\s*=\s*["'][^"']+["']'''),
              re.compile(r'''DASHBOARD_SECRET\s*=\s*["'][^"']+["']'''),
          ]
          allowed = {".py", ".yml", ".yaml", ".json", ".md"}
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix not in allowed:
                  continue
              if path.as_posix() == ".github/workflows/security.yml":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_no}")
          if hits:
              print("Potential hard-coded secret pattern found:")
              print("\n".join(hits))
              raise SystemExit(1)
          print("No obvious committed secrets detected.")
          PY
