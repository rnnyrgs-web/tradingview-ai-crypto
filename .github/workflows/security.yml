name: Security and Reliability

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      # EXACT_HEAD_PR_CHECKOUT_V1: pull_request evidence must execute the exact PR head,
      # not GitHub's synthetic refs/pull/<n>/merge checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Security checkout identity mismatch: expected=$EXPECTED_SHA actual=$ACTUAL_SHA" >&2
            exit 1
          fi
          echo "Verified Security and Reliability subject SHA: $ACTUAL_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit
      - name: Unit tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r . -x ./tests
      - name: Reject obvious committed secrets
        run: python security_secret_scan.py
