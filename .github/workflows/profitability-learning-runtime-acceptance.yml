name: Profitability Learning Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profitability-learning-runtime-acceptance.yml
      - Dockerfile
      - requirements.txt
      - app.py
      - config.py
      - btc_leadlag_selection.py
      - volatility_breakout_selection.py
      - db.py
      - profitability_learning/**
      - orchestration/evidence/disc_btc_leadlag_001_20260919.json.gz
      - orchestration/rejected_fingerprints.json
      - orchestration/signal_development_objective.json
      - research_artifact.py
      - research_heavy_experiment_scheduler.py
      - signal_development.py
      - supabase/migrations/**

permissions:
  contents: read

concurrency:
  group: profitability-learning-runtime-acceptance
  cancel-in-progress: false

jobs:
  exact-deployed-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Await exact deployed SHA and verify durable learning loop
        env:
          ACCEPTANCE_URL: https://tradingview-ai-crypto.onrender.com/research/profitability-learning/acceptance
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SCAN_SECRET"
          response="$(mktemp)"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "X-Scan-Secret: $SCAN_SECRET" \
              --connect-timeout 10 --max-time 45 \
              "$ACCEPTANCE_URL" || true)"
            if [ "$status" = "200" ] && jq -e --arg sha "$GITHUB_SHA" '
              .completion.training.experiment_id as $training_id |
              .ok == true and
              .deployed_sha == $sha and
              .fingerprint_id == "DISC-BTC-LEADLAG-001-v1" and
              .screen_status == "PRE_OOS_FAIL" and
              .completion.training.outcome == "LEARN_AND_PIVOT" and
              .completion.validation.outcome == "LEARN_AND_PIVOT" and
              .completion.training.persistence_status == "PERSISTED" and
              .completion.validation.persistence_status == "PERSISTED" and
              .persistence.replay_idempotent == true and
              .persistence.target_experiment_count == 2 and
              .learning_consumption.rejected_exact_fingerprint == true and
              .learning_consumption.queue_feedback_reason == "rejected_exact_fingerprint" and
              .learning_consumption.queue_feedback_changes_eligibility == true and
              .learning_consumption.heavy_dispatch_selected_count == 0 and
              (.learning_consumption.component_observation_count >= 1) and
              (.learning_consumption.matched_learning_missions | any(
                .mode == "LEARN" and .source_experiment_id == $training_id
              )) and
              .evidence_boundaries.untouched_oos_opened == false and
              .evidence_boundaries.genuine_forward_opened == false and
              .safety.trade_authority == false and
              .safety.promotion_authority == false and
              .safety.broker_connected == false
            ' "$response" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "last_http_status=$status" >&2
          if jq -e 'type == "object"' "$response" >/dev/null 2>&1; then
            jq -c '{
              ok: .ok?,
              deployed_sha: .deployed_sha?,
              fingerprint_id: .fingerprint_id?,
              screen_status: .screen_status?,
              completion: {
                training: {
                  experiment_id: .completion.training.experiment_id?,
                  outcome: .completion.training.outcome?,
                  persistence_status: .completion.training.persistence_status?
                },
                validation: {
                  experiment_id: .completion.validation.experiment_id?,
                  outcome: .completion.validation.outcome?,
                  persistence_status: .completion.validation.persistence_status?
                }
              },
              persistence: {
                replay_idempotent: .persistence.replay_idempotent?,
                target_experiment_count: .persistence.target_experiment_count?
              },
              learning_consumption: {
                rejected_exact_fingerprint: .learning_consumption.rejected_exact_fingerprint?,
                queue_feedback_reason: .learning_consumption.queue_feedback_reason?,
                heavy_dispatch_selected_count: .learning_consumption.heavy_dispatch_selected_count?,
                component_observation_count: .learning_consumption.component_observation_count?,
                matched_learning_mission_count:
                  ((.learning_consumption.matched_learning_missions? // []) | length)
              },
              evidence_boundaries: {
                untouched_oos_opened: .evidence_boundaries.untouched_oos_opened?,
                genuine_forward_opened: .evidence_boundaries.genuine_forward_opened?
              },
              safety: {
                trade_authority: .safety.trade_authority?,
                promotion_authority: .safety.promotion_authority?,
                broker_connected: .safety.broker_connected?
              }
            }' "$response" >&2
          else
            echo "response_not_json" >&2
          fi
          echo "Exact deployed-SHA Profitability Learning acceptance did not pass" >&2
          exit 1
