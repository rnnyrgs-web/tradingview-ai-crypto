name: One-shot reviewer base64 preflight fix

on:
  push:
    branches:
      - agent/reviewer-base64-preflight-fix-20260924

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewer-base64-preflight-fix-20260924
          fetch-depth: 0
      - name: Apply bounded fail-closed fix and regressions
        shell: bash
        env:
          EXPECTED_BASE_SHA: 55e3ad02c3f050510c621cc04616c1112fe2b4a6
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$EXPECTED_BASE_SHA"
          python - <<'PY'
          from pathlib import Path

          source = Path("orchestration/reviewer_trust_root.py")
          text = source.read_text(encoding="utf-8")
          old = '''    try:\n        return base64.b64decode(raw, validate=True)\n    except (ValueError, TypeError) as exc:\n        raise RuntimeError("trusted server workflow source base64 invalid") from exc\n'''
          new = '''    # GitHub's Contents API line-wraps base64 payloads. Strip only CR/LF\n    # transport formatting, while keeping strict validation for every other byte.\n    normalized = raw.replace("\\n", "").replace("\\r", "")\n    try:\n        return base64.b64decode(normalized, validate=True)\n    except (ValueError, TypeError) as exc:\n        raise RuntimeError("trusted server workflow source base64 invalid") from exc\n'''
          if text.count(old) != 1:
              raise SystemExit("expected reviewer decode block not found exactly once")
          source.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/test_reviewer_trust_root.py")
          t = tests.read_text(encoding="utf-8")
          marker = "def test_server_workflow_bytes_accepts_github_line_wrapped_base64()"
          if marker in t:
              raise SystemExit("base64 regressions already present")
          addition = r'''


def test_server_workflow_bytes_accepts_github_line_wrapped_base64() -> None:
    raw = b"trusted-workflow-bytes" * 8
    encoded = base64.b64encode(raw).decode("ascii")
    wrapped = "\r\n".join(encoded[i : i + 16] for i in range(0, len(encoded), 16)) + "\n"
    payload = {
        "type": "file",
        "encoding": "base64",
        "content": wrapped,
    }
    assert trust._server_workflow_bytes(payload) == raw


def test_server_workflow_bytes_rejects_non_transport_whitespace() -> None:
    raw = b"trusted-workflow-bytes"
    encoded = base64.b64encode(raw).decode("ascii")
    payload = {
        "type": "file",
        "encoding": "base64",
        "content": encoded[:4] + " " + encoded[4:],
    }
    with pytest.raises(RuntimeError, match="trusted server workflow source base64 invalid"):
        trust._server_workflow_bytes(payload)
'''
          tests.write_text(t + addition, encoding="utf-8")
          PY
          python -m py_compile orchestration/reviewer_trust_root.py tests/test_reviewer_trust_root.py
          rm .github/workflows/one_shot_reviewer_base64_fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestration/reviewer_trust_root.py tests/test_reviewer_trust_root.py .github/workflows/one_shot_reviewer_base64_fix.yml
          git commit -m "fix: accept GitHub line-wrapped workflow base64"
          git push origin HEAD:agent/reviewer-base64-preflight-fix-20260924
