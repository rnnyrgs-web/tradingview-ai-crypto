name: One-shot harden abnormal-day Stage-1 adapter

on:
  push:
    branches:
      - agent/ext-abnormal-day-momentum-stage1-adapter-20260921
    paths:
      - .github/workflows/ext_abnormal_stage1_hardening_once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ext-abnormal-day-momentum-stage1-adapter-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind second development parse to authenticated bytes and receipt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('orchestration/external_replication/run_ext_abnormal_day_momentum_001_stage1.py')
          text = p.read_text(encoding='utf-8')
          old = '''    _parse_development_view,\n    _parse_hour,\n    qualify_cohort001_dataset,\n)\n'''
          new = '''    _git_blob_sha1,\n    _parse_development_view,\n    _parse_hour,\n    qualify_cohort001_dataset,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('import anchor drifted')
          text = text.replace(old, new, 1)
          old = '''    compressed = dataset_path.read_bytes()\n    uncompressed = gzip.decompress(compressed)\n'''
          new = '''    compressed = dataset_path.read_bytes()\n    if _git_blob_sha1(compressed) != qualification["source_git_blob_sha1"]:\n        raise RuntimeError("dataset bytes changed after protected-safe qualification")\n    uncompressed = gzip.decompress(compressed)\n'''
          if text.count(old) != 1:
              raise SystemExit('dataset parse anchor drifted')
          text = text.replace(old, new, 1)
          old = '''            "execution_contract_id": execution["execution_contract_id"],\n            "classification": "DATA/PIT_INCONCLUSIVE",\n'''
          new = '''            "execution_contract_id": execution["execution_contract_id"],\n            "execution_contract_sha256": sha256_hex(execution),\n            "classification": "DATA/PIT_INCONCLUSIVE",\n'''
          if text.count(old) != 1:
              raise SystemExit('inconclusive result anchor drifted')
          text = text.replace(old, new, 1)
          old = '''        "execution_contract_id": execution["execution_contract_id"],\n        "classification": classification,\n'''
          new = '''        "execution_contract_id": execution["execution_contract_id"],\n        "execution_contract_sha256": sha256_hex(execution),\n        "classification": classification,\n'''
          if text.count(old) != 1:
              raise SystemExit('scored result anchor drifted')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run focused synthetic tests
        run: python -m pytest -q tests/test_ext_abnormal_day_momentum_stage1_adapter.py tests/test_ext_abnormal_day_momentum_predeclaration.py
      - name: Commit only the scientific adapter hardening
        run: |
          git config user.name "strategy-factory-bot"
          git config user.email "strategy-factory-bot@users.noreply.github.com"
          git add orchestration/external_replication/run_ext_abnormal_day_momentum_001_stage1.py
          git diff --cached --check
          git commit -m "Bind abnormal-day Stage-1 to authenticated dataset bytes"
          git push origin HEAD:agent/ext-abnormal-day-momentum-stage1-adapter-20260921
