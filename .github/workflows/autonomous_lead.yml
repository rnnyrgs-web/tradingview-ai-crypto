name: Autonomous Lead Integrator

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Autonomous Specialist Agents
      - Cost-Bounded Autonomous Cloud Specialist
    types:
      - completed
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-lead-integrator
  cancel-in-progress: false

jobs:
  review-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_AGENT_MODEL: gpt-5.6-sol
      # Review-only. This workflow must never push or merge candidates to main.
      AUTONOMOUS_MERGE_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lead runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Fail closed unless agent credentials are configured
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY missing"; exit 1; }
          test -n "$OPENAI_AGENT_MODEL" || { echo "OPENAI_AGENT_MODEL missing"; exit 1; }
      - name: Select oldest current-base autonomous candidate
        id: select
        run: |
          git fetch origin main '+refs/heads/auto/*:refs/remotes/origin/auto/*'
          BASE_SHA="$(git rev-parse origin/main)"
          SELECTED=""
          SELECTED_SHA=""
          while IFS= read -r REF; do
            [ -n "$REF" ] || continue
            if git merge-base --is-ancestor "$REF" origin/main 2>/dev/null; then
              continue
            fi
            MERGE_BASE="$(git merge-base origin/main "$REF" 2>/dev/null || true)"
            [ "$MERGE_BASE" = "$BASE_SHA" ] || continue
            HEAD_SHA="$(git rev-parse "$REF")"
            ALREADY="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$HEAD_SHA in:title" --limit 10 --json number --jq '.[0].number // empty' || true)"
            [ -z "$ALREADY" ] || continue
            SELECTED="${REF#origin/}"
            SELECTED_SHA="$HEAD_SHA"
            break
          done < <(git for-each-ref --sort=committerdate --format='%(refname:short)' refs/remotes/origin/auto/)
          echo "branch=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$SELECTED" ]; then
            echo "No current-base autonomous candidate is waiting."
          else
            echo "Selected $SELECTED at $SELECTED_SHA"
          fi
      - name: Stop when candidate queue is empty
        if: steps.select.outputs.branch == ''
        run: echo "Queue empty; nothing to review."
      - name: Require exact candidate Security and Reliability success
        if: steps.select.outputs.branch != ''
        env:
          BRANCH: ${{ steps.select.outputs.branch }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
        run: |
          FOUND=""
          for ATTEMPT in $(seq 1 24); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Security and Reliability' --branch "$BRANCH" --limit 20 --json databaseId,status,conclusion,headSha)"
            MATCH="$(printf '%s' "$RUNS" | jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headSha == $sha)] | .[0] // empty')"
            if [ -n "$MATCH" ]; then
              STATUS="$(printf '%s' "$MATCH" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$MATCH" | jq -r '.conclusion // ""')"
              echo "Security run for $HEAD_SHA: status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] || { echo "Exact candidate security run did not pass; fail closed."; exit 1; }
                FOUND="yes"
                break
              fi
            fi
            sleep 20
          done
          [ "$FOUND" = "yes" ] || { echo "No completed successful Security and Reliability run found for exact candidate SHA; fail closed."; exit 1; }
      - name: Fetch and bound candidate diff
        if: steps.select.outputs.branch != ''
        env:
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          git diff --binary origin/main..."origin/$BRANCH" > /tmp/candidate.diff
          BYTES="$(wc -c < /tmp/candidate.diff)"
          echo "Diff bytes: $BYTES"
          test "$BYTES" -gt 0
          test "$BYTES" -le 80000 || { echo "Diff too large; fail closed."; exit 1; }
          if grep -Eq '^diff --git a/(AI_STATE\.md|agents/|\.github/workflows/|requirements\.txt|Dockerfile)' /tmp/candidate.diff; then
            echo "Protected path changed; refusing autonomous integration."
            exit 1
          fi
      - name: Independent security review
        if: steps.select.outputs.branch != ''
        run: python agents/autonomous_orchestrator.py review --reviewer security --diff /tmp/candidate.diff --output /tmp/security-review.json
      - name: Independent lead review
        if: steps.select.outputs.branch != ''
        run: python agents/autonomous_orchestrator.py review --reviewer lead --diff /tmp/candidate.diff --output /tmp/lead-review.json
      - name: Require both AI reviewers to approve
        if: steps.select.outputs.branch != ''
        run: |
          jq -e '.approve == true' /tmp/security-review.json
          jq -e '.approve == true' /tmp/lead-review.json
          echo "Security review:" && cat /tmp/security-review.json
          echo "Lead review:" && cat /tmp/lead-review.json
      - name: Record approved review-only candidate
        if: steps.select.outputs.branch != ''
        env:
          BRANCH: ${{ steps.select.outputs.branch }}
          HEAD_SHA: ${{ steps.select.outputs.sha }}
        run: |
          BODY="$(printf 'Candidate branch: `%s`\nExact reviewed SHA: `%s`\n\nSecurity and Reliability: PASS on exact candidate SHA.\n\nAutonomous Security review:\n```json\n%s\n```\n\nAutonomous Lead review:\n```json\n%s\n```\n\nThis workflow is review-only and has no contents write permission, so the candidate remains unmerged pending an explicit Lead Integrator cycle.' "$BRANCH" "$HEAD_SHA" "$(cat /tmp/security-review.json)" "$(cat /tmp/lead-review.json)")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "autonomous-review: $HEAD_SHA" --body "$BODY"
          {
            echo "### Autonomous candidate approved for explicit review"
            echo "- Branch: $BRANCH"
            echo "- SHA: $HEAD_SHA"
            echo "- Security CI: PASS"
            echo "- Security AI: APPROVE"
            echo "- Lead AI: APPROVE"
            echo "- Merge: DISABLED / MANUAL LEAD INTEGRATION REQUIRED"
          } >> "$GITHUB_STEP_SUMMARY"
