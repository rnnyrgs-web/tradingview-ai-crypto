name: Cloud Crypto Research

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "strategy_families.py"
      - "research_runner.py"
      - "backtest.py"
      - "market_data.py"
      - ".github/workflows/cloud_research.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-crypto-research-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard:
          - {name: universe-00, shard_index: "0", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-01, shard_index: "1", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-02, shard_index: "2", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-03, shard_index: "3", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-04, shard_index: "4", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-05, shard_index: "5", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-06, shard_index: "6", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-07, shard_index: "7", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-08, shard_index: "8", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-09, shard_index: "9", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-10, shard_index: "10", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-11, shard_index: "11", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-12, shard_index: "12", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-13, shard_index: "13", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-14, shard_index: "14", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: universe-15, shard_index: "15", shard_count: "16", universe_size: "80", symbols: "", timeframes: "15m,1H"}
          - {name: swing-a, shard_index: "0", shard_count: "1", universe_size: "5", symbols: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,LINK-USDT", timeframes: "4H,1D"}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_SYMBOLS: ${{ matrix.shard.symbols }}
      RESEARCH_UNIVERSE_SIZE: ${{ matrix.shard.universe_size }}
      RESEARCH_FORCE_SYMBOLS: "PONS-USDT-SWAP"
      RESEARCH_SHARD_INDEX: ${{ matrix.shard.shard_index }}
      RESEARCH_SHARD_COUNT: ${{ matrix.shard.shard_count }}
      RESEARCH_TIMEFRAMES: ${{ matrix.shard.timeframes }}
      RESEARCH_BARS: "5000"
      RESEARCH_THRESHOLD: "2.25"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run cloud backtests and strategy registry
        run: python research_runner.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backtest-results-${{ matrix.shard.name }}
          path: |
            research_output/backtest_results.json
            research_output/strategy_registry.json
          retention-days: 7
      - name: Upload compact sealed promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: promotion-evidence-${{ matrix.shard.name }}
          path: research_output/strategy_registry.json
          retention-days: 30

  aggregate-repeated-runs:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download current sealed evidence
        uses: actions/download-artifact@v4
        with:
          pattern: promotion-evidence-*
          path: evidence/current
      - name: Download two prior successful evidence sets when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow cloud_research.yml --status success --limit 2 --json databaseId --jq '.[].databaseId' > /tmp/prior-runs.txt
          while read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            mkdir -p "evidence/$RUN_ID"
            gh run download "$RUN_ID" --pattern 'promotion-evidence-*' --dir "evidence/$RUN_ID" || true
          done < /tmp/prior-runs.txt
      - name: Aggregate distinct verified runs
        run: python research_aggregation.py --input evidence --output research_output/repeated_run_evidence.json --minimum-runs 3
      - name: Upload sealed repeated-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: repeated-run-evidence
          path: research_output/repeated_run_evidence.json
          retention-days: 30
