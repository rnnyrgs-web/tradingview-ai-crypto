name: Cloud Crypto Research

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-crypto-research
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - {name: majors-a, symbols: "BTC-USDT,ETH-USDT,SOL-USDT", timeframes: "15m,1H"}
          - {name: majors-b, symbols: "XRP-USDT,LINK-USDT,BNB-USDT", timeframes: "15m,1H"}
          - {name: majors-c, symbols: "DOGE-USDT,ADA-USDT,TRX-USDT", timeframes: "15m,1H"}
          - {name: swing-a, symbols: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,LINK-USDT", timeframes: "4H,1D"}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_SYMBOLS: ${{ matrix.shard.symbols }}
      RESEARCH_TIMEFRAMES: ${{ matrix.shard.timeframes }}
      RESEARCH_BARS: "5000"
      RESEARCH_THRESHOLD: "2.25"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run cloud backtests and strategy registry
        run: python research_runner.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backtest-results-${{ matrix.shard.name }}
          path: |
            research_output/backtest_results.json
            research_output/strategy_registry.json
          retention-days: 7
